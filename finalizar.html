<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="formPedido">
        
        <label>Produto:</label>
        <input type="text" id="produto" value="Lamen original" readonly><br><br>
      
        <h3>Endereço de Entrega</h3>
        
        <label>CEP:</label>
        <input type="text" id="cep" placeholder="00000-000" required><br><br>
      
        <label>Logradouro (Rua/Av):</label>
        <input type="text" id="rua" required><br><br>
      
        <label>Número:</label>
        <input type="text" id="numero" required><br><br>
      
        <label>Bairro:</label>
        <input type="text" id="bairro" required><br><br>
      
        <label>Cidade:</label>
        <input type="text" id="cidade" required><br><br>
      
        <button type="submit">Enviar Pedido</button>
      </form>
</body>
</html>
